# Postgres lokal untuk pengembangan. Produksi memakai Postgres dari Vercel.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: katering
      POSTGRES_PASSWORD: katering
      POSTGRES_DB: katering
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katering"]
      interval: 3s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
volumes:
  pgdata:
